name: Unit, contract and local telemetry tests

# The base job keeps optional runtimes absent. The telemetry job installs OPC UA,
# exercises current contracts, and reads back a fresh local fixture replay.
# Neither job proves Spark/Kafka/Iceberg/Airflow or production operation.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-tests:
    name: Base unit/contract suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install base dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c requirements-dev.lock

      - name: Report skipped optional runtimes
        run: |
          python - <<'PY'
          import importlib.util as u
          for name in ("pyspark", "airflow", "confluent_kafka"):
              print(f"{name}: {'present' if u.find_spec(name) else 'absent (optional tests will skip)'}")
          PY

      - name: Run base unit and contract tests
        run: PYTHONPATH=src python -m pytest -q

  telemetry-runtime:
    name: Local OPC UA and trusted dataset read-back
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned base and OPC UA dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Require current runtime dependencies
        run: python -c 'import asyncua; print(asyncua.__version__)'
      - name: Run current contract and report tests
        run: >-
          python -m pytest -q tests/test_industrial_source_contract.py
          tests/test_event_time_trust.py tests/test_industrial_trust_report.py
      - name: Replay fixture and verify retained trusted data
        run: PYTHON_BIN=python bash scripts/verify_telemetry.sh
