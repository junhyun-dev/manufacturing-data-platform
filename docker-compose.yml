services:
  telemetry-review:
    build:
      context: .
      args:
        RELEASE_VERSION: ${MFG_REVIEW_RELEASE:-0.1.0-dev}
        VCS_REF: ${MFG_REVIEW_REVISION:-local}
    ports:
      - "${MFG_REVIEW_BIND:-127.0.0.1}:${MFG_REVIEW_PORT:-8000}:8000"
    environment:
      MFG_REVIEW_HOSTS: ${MFG_REVIEW_HOSTS:-localhost,127.0.0.1,[::1]}
      MFG_REVIEW_MODE: ${MFG_REVIEW_MODE:-full}
      MFG_REVIEW_SECURE_COOKIE: ${MFG_REVIEW_SECURE_COOKIE:-0}
    volumes:
      - telemetry_review_data:/var/lib/telemetry-review
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped

  mongo:
    profiles: [historical]
    image: mongo:7
    container_name: manufacturing-data-platform-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  telemetry_review_data:
  mongo_data:
